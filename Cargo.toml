[package]
name = "firmina"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive","env"] }
cryptoki = "0.12.0"
dialoguer = "0.12.0"
digest-io = "0.1.0"
env_logger = "0.11.11"
hex = "0.4.3"
log = "0.4.33"
lopdf = "0.46"
rasn = "0.29"
rasn-cms = "0.29"
rasn-pkix = "0.29"
rasn-smime = "0.29"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
rfd = "0.17.2"
slint = "1.18.1"
anyhow = "1.0.104"


[build-dependencies]
slint-build = "1.18.1"

[profile.release]
codegen-units = 1
lto = true
